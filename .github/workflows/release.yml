name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "suqi ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      # Windows 额外上传单文件绿色版 exe
      - name: Rename portable exe
        if: matrix.os == 'windows-latest'
        run: cp src-tauri/target/release/suqi.exe src-tauri/target/release/suqi_${{ github.ref_name }}_x64_portable.exe

      - name: Upload portable exe
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/suqi_${{ github.ref_name }}_x64_portable.exe

      # 生成 SHA-256 校验文件
      - name: Generate SHA-256 checksums
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue
          $files += Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -ErrorAction SilentlyContinue
          $files += Get-ChildItem 'src-tauri/target/release/suqi_*_x64_portable.exe' -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) { throw '未找到任何发布产物' }
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content 'sha256sums.txt' -Encoding utf8
          Get-Content 'sha256sums.txt'

      - name: Upload SHA-256 checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: sha256sums.txt
