<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="10"/>
  <circle cx="512" cy="512" r="252" fill="none" stroke="#bae6fd" stroke-opacity="0.22" stroke-width="6"/>
  <g filter="url(#glow)">
    <path fill="url(#bolt)" d="M560 190 L392 548 L498 548 L452 834 L664 462 L544 462 Z"/>
  </g>
  <path fill="#7dd3fc" opacity="0.85" d="M756 300 L810 326 L742 372 L762 330 Z"/>
  <circle cx="800" cy="248" r="12" fill="#bae6fd"/>
  <circle cx="838" cy="300" r="8" fill="#7dd3fc"/>
  <!-- 右上角 LS 艺术字：斜切飞白 + 拖尾光晕 -->
  <g transform="translate(792 210) rotate(18)">
    <ellipse cx="6" cy="0" rx="120" ry="86" fill="#38bdf8" opacity="0.22"/>
    <text x="0" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="118" font-weight="800" font-style="italic" fill="url(#bolt)" stroke="#e0f2fe" stroke-width="2" letter-spacing="-2" filter="url(#glow)">LS</text>
    <path d="M-104 -56 Q -40 -84 46 -70" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <circle cx="-96" cy="52" r="7" fill="#bae6fd"/>
    <circle cx="96" cy="-44" r="5" fill="#7dd3fc"/>
  </g>
</svg>
