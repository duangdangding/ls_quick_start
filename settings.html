<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>速启设置</title>
  </head>
  <body>
    <main id="settings">
      <nav class="tabs">
        <button class="tab active" data-tab="general">常规</button>
        <button class="tab" data-tab="appearance">外观</button>
        <button class="tab" data-tab="data">数据库</button>
        <button class="tab" data-tab="about">关于</button>
      </nav>

      <section class="tab-page active" id="tab-general">
        <div class="field">
          <label>全局快捷键（呼出/隐藏面板）</label>
          <div class="row">
            <button id="hotkey" class="hotkey-btn" type="button">点击录制</button>
            <button id="hotkey-reset" type="button">恢复默认</button>
          </div>
          <small>按下组合键后松开即完成录制（例如 Win+`）</small>
        </div>
        <div class="field">
          <label>启动</label>
          <label class="check"><input type="checkbox" id="autostart" /> 开机自启动</label>
          <label class="check"><input type="checkbox" id="silent-start" /> 静默启动（不显示主面板）</label>
        </div>
        <div class="field">
          <label>面板</label>
          <label class="check"><input type="checkbox" id="always-on-top" /> 窗口置顶</label>
          <label class="check"><input type="checkbox" id="remember-size" /> 记住窗口大小</label>
        </div>
        <div class="field">
          <label>配置文件目录</label>
          <div class="row">
            <code id="config-dir">加载中…</code>
            <button id="btn-change-config-dir" type="button">更改…</button>
            <button id="btn-reset-config-dir" type="button">恢复默认</button>
          </div>
          <small>默认在程序目录下，可自定义到其他位置</small>
        </div>
      </section>

      <section class="tab-page" id="tab-appearance">
        <div class="field">
          <label>主题</label>
          <select id="theme">
            <option value="dark">深色</option>
            <option value="light">浅色</option>
          </select>
        </div>
        <div class="field">
          <label>高亮颜色</label>
          <div class="row">
            <input type="color" id="highlight-color" />
            <label class="check"><input type="checkbox" id="highlight-follow" /> 跟随主题</label>
          </div>
        </div>
        <div class="field">
          <label>字号</label>
          <input type="number" id="font-size" min="10" max="24" step="1" />
        </div>
        <div class="field">
          <label>窗口效果（透明材质）</label>
          <select id="window-effect">
            <option value="default">默认（不透明）</option>
            <option value="acrylic">亚克力</option>
            <option value="mica">云母</option>
            <option value="vibrancy">毛玻璃</option>
          </select>
          <small>切换后呼出主面板可实时预览</small>
        </div>
        <div class="field">
          <label>面板背景</label>
          <label class="check"><input type="checkbox" id="bg-enabled" /> 启用面板背景图</label>
          <div class="row">
            <button id="bg-pick" type="button">选择图片…</button>
            <button id="bg-clear" type="button" disabled>清除背景</button>
          </div>
          <label class="check"><input type="checkbox" id="bg-apply-settings" /> 同时应用到设置窗口</label>
          <div id="bg-editor" class="bg-editor-wrap" hidden>
            <div class="bg-preview">
              <div class="bg-preview-layer" id="bg-preview-layer"></div>
              <div class="bg-preview-mock">
                <div class="bgp-toolbar">
                  <span class="bgp-search"></span>
                  <span class="bgp-btn"></span>
                  <span class="bgp-btn"></span>
                </div>
                <div class="bgp-tabs">
                  <span class="bgp-tab active"></span>
                  <span class="bgp-tab"></span>
                  <span class="bgp-tab"></span>
                  <span class="bgp-tab"></span>
                </div>
                <div class="bgp-list">
                  <div class="bgp-item"><div class="bar"></div><div class="bar short"></div></div>
                  <div class="bgp-item"><div class="bar"></div><div class="bar short"></div></div>
                  <div class="bgp-item"><div class="bar"></div><div class="bar short"></div></div>
                  <div class="bgp-item"><div class="bar"></div><div class="bar short"></div></div>
                </div>
                <div class="bgp-footer"><div class="bar"></div></div>
              </div>
            </div>
            <div class="bg-options">
              <label class="field">填充方式
                <select id="bg-mode">
                  <option value="stretch">拉伸（铺满面板）</option>
                  <option value="tile">平铺（原尺寸重复）</option>
                </select>
              </label>
              <label class="field">背景透明度
                <div class="bg-slider-row">
                  <input id="bg-opacity" type="range" min="5" max="100" step="1" />
                  <span id="bg-opacity-val" class="bg-slider-val">60%</span>
                </div>
              </label>
              <label class="field">图片宽度（占面板百分比）
                <div class="bg-slider-row">
                  <input id="bg-scale-w" type="range" min="5" max="300" step="1" />
                  <span id="bg-scale-w-val" class="bg-slider-val">100%</span>
                </div>
              </label>
              <label class="field">图片高度（占面板百分比）
                <div class="bg-slider-row">
                  <input id="bg-scale-h" type="range" min="5" max="300" step="1" />
                  <span id="bg-scale-h-val" class="bg-slider-val">100%</span>
                </div>
              </label>
              <div class="field">
                <small style="display:block;margin-bottom:6px">旋转</small>
                <div class="bg-rotate-row">
                  <button class="bg-rot" data-rot="0" type="button">0°</button>
                  <button class="bg-rot" data-rot="90" type="button">90°</button>
                  <button class="bg-rot" data-rot="180" type="button">180°</button>
                  <button class="bg-rot" data-rot="270" type="button">270°</button>
                </div>
              </div>
              <div class="field">
                <div class="row">
                  <button id="bg-region-toggle" type="button">选择图片区域…</button>
                  <button id="bg-region-reset" type="button" disabled>重置为整图</button>
                </div>
                <div id="bg-region-wrap" hidden>
                  <div class="bg-region-box" id="bg-region-box">
                    <img id="bg-region-img" alt="背景源图" />
                    <div class="bg-region-rect" id="bg-region-rect"></div>
                  </div>
                  <small>在图片上按住拖动，框选用作背景的区域；再次点击「选择图片区域…」收起。</small>
                </div>
              </div>
              <div class="row">
                <button id="bg-apply" type="button">应用背景</button>
              </div>
            </div>
          </div>
          <small>支持 PNG / JPG / WebP / BMP / GIF，最大 30MB；选择图片后在预览中调整，点「应用背景」后生效</small>
        </div>
      </section>

      <section class="tab-page" id="tab-data">
        <div class="field">
          <label>数据库目录</label>
          <div class="row">
            <code id="db-dir">加载中…</code>
            <button id="btn-change-db-dir" type="button">更改…</button>
            <button id="btn-reset-db-dir" type="button">恢复默认</button>
          </div>
          <small>数据库文件默认在程序目录下，可自定义到其他位置</small>
        </div>
        <div class="field">
          <label>数据库信息</label>
          <div class="db-info">
            <div>路径：<code id="db-path">-</code></div>
            <div>大小：<span id="db-size">-</span></div>
            <div>项目数：<span id="db-items">-</span></div>
            <div>分组数：<span id="db-groups">-</span></div>
            <div>密码已设置：<span id="db-password">-</span></div>
          </div>
          <button id="btn-refresh-db" type="button">刷新</button>
        </div>
      </section>

      <section class="tab-page" id="tab-about">
        <div class="field">
          <h2>速启</h2>
          <p>Windows 快捷启动器</p>
          <p>当前版本：<strong id="cur-version">-</strong></p>
          <p>
            <a href="https://github.com/" target="_blank" rel="noreferrer">GitHub 仓库</a>
          </p>
        </div>
        <div class="field">
          <label>自动更新</label>
          <div class="row">
            <button id="btn-check-update" class="primary" type="button">检查更新</button>
            <span id="update-version-info" style="color: var(--muted); font-size: 12px;"></span>
          </div>
          <div id="update-progress-wrap" style="display:none;">
            <div class="update-progress">
              <progress id="update-progress" value="0" max="100"></progress>
              <span id="update-progress-text">0%</span>
            </div>
            <div class="update-status" id="update-status"></div>
          </div>
          <small>检查到更新后可选择下载并安装，支持便携版自动替换和安装版下载安装包</small>
        </div>
      </section>

      <footer>
        <button id="btn-save" class="primary" type="button">保存</button>
        <span id="save-msg"></span>
      </footer>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
